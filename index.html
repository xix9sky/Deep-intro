<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 5rem;
            color: #ffffff;
            text-shadow: 0 0 20px #e94560, 0 0 40px #e94560;
            animation: glow 2s infinite alternate, popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #e94560, 0 0 20px #e94560, 0 0 30px #00fff0;
            }
            to {
                text-shadow: 0 0 20px #00fff0, 0 0 40px #00fff0, 0 0 60px #e94560;
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <h1>Deep</h1>
</body>
</html>
